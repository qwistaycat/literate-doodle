<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="controls">
      <select id="drawing-select">
        <option value="laoganma">Laoganma</option>
        <option value="kris">Kris</option>
        <option value="loopy">Loopy</option>
      </select>
      <input type="range" id="epicycle-slider" min="1" max="1" value="1" />
      <input type="number" id="epicycle-slider-value" min="1" max="1" value="1" />
      <input type="range" id="zoom-slider" min="50" max="400" value="100" />
      <span id="zoom-slider-value">1.00x</span>
      <button id="toggle-epicycles" type="button">Hide epicycles</button>
      <button id="reset-play" type="button">Reset play</button>
      <span id="selected-ring-info" class="hint">Selected: none</span>
    </div>

    <script src="../time/ct.js?v=20260404"></script>
    <script src="../time/svg-parser.js?v=20260404"></script>
    <script src="../time/fourier.js?v=20260404"></script>
    <script src="sketch.js?v=20260404"></script>
  </body>
</html>
